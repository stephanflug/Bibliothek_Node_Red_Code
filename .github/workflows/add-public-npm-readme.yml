name: Add public npm install docs

on:
  push:
    paths:
      - ".github/workflows/add-public-npm-readme.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Öffentliche npm-Installation ergänzen
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'README.md';
          let text = fs.readFileSync(file, 'utf8');
          const marker = '### Installation über npm / Node-RED Palette';
          if (!text.includes(marker)) {
            const anchor = '## Installation\n\n';
            const block = `### Installation über npm / Node-RED Palette\n\nNach der öffentlichen Veröffentlichung kann der Basis-Node direkt aus npm installiert werden:\n\n\`\`\`bash\ncd ~/.node-red\nnpm install @stephanflug/node-red-ebst-remote-function\n\`\`\`\n\nOder direkt in Node-RED:\n\n\`\`\`text\nMenü → Manage palette / Palette verwalten → Install\nSuche: @stephanflug/node-red-ebst-remote-function\n\`\`\`\n\nDanach steht unter **Function** der Node **EBST Node Red Remote Funktion** zur Verfügung. Die einzelnen Funktionen werden anschließend zentral über das GitHub-Manifest geladen und aktualisiert.\n\n> Bei einem Wechsel von der bisherigen lokalen/TGZ-Installation sollte zuerst das alte Paket \`node-red-contrib-ebst-remote-function\` entfernt werden, damit nicht zwei Pakete denselben Node-Typ registrieren.\n\n### Manuelle Installation über TGZ\n\n`;
            if (!text.includes(anchor)) throw new Error('Installationsabschnitt nicht gefunden');
            text = text.replace(anchor, anchor + block);
            fs.writeFileSync(file, text);
          }
          NODE

      - name: Änderung committen
        run: |
          if git diff --quiet -- README.md; then
            echo "README bereits aktuell."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Öffentliche npm Installation im README dokumentieren"
          git push
