name: EBST Aufheizdauer-Funktion registrieren

on:
  push:
    paths:
      - ".github/workflows/register-aufheizdauer-function.yml"

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Manifest und README aktualisieren
        run: |
          node <<'NODE'
          const fs = require('fs');

          const manifestFile = 'remote/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestFile, 'utf8'));
          manifest.functions['aufheizdauer-berechnung'] = {
            name: 'Aufheizdauer berechnen',
            category: 'Heizung',
            version: '1.0.0',
            url: 'https://raw.githubusercontent.com/stephanflug/Bibliothek_Node_Red_Code/main/remote/functions/heizung/aufheizdauer-berechnung.js',
            description: 'Berechnet aus aktueller Temperatur, Aufheizstatus und aktueller oder fest hinterlegter Heizleistung die voraussichtliche Rest-Aufheizdauer bis zur Zieltemperatur. Lernt die reale Aufheizcharakteristik und speichert den Lernzustand persistent über Node-RED-Neustarts.',
            localFile: 'remote/functions/heizung/aufheizdauer-berechnung.js',
            outputs: 1,
            outputLabels: ['Aufheizdauer'],
            settings: [
              {id:'targetTemperatureC',label:'Zieltemperatur',type:'number',default:22,min:-50,max:120,step:0.1,required:true,unit:'°C',description:'Zieltemperatur. Ein Zielwert im msg.payload überschreibt diese Einstellung.'},
              {id:'powerMode',label:'Leistungsquelle',type:'select',default:'auto',required:true,options:[{value:'auto',label:'Payload, sonst feste Leistung'},{value:'payload',label:'Nur Leistung aus Payload'},{value:'fixed',label:'Nur feste Leistung'}],description:'Legt fest, woher die aktuelle Heizleistung verwendet wird.'},
              {id:'payloadPowerUnit',label:'Einheit generische Payload-Leistung',type:'select',default:'kW',required:true,options:[{value:'kW',label:'kW'},{value:'W',label:'W'}],description:'Einheit für generische Felder power/leistung. Felder powerW/leistungW werden immer als Watt erkannt.'},
              {id:'fixedPowerKw',label:'Feste Heizleistung',type:'number',default:5,min:0,max:10000,step:0.01,required:true,unit:'kW',description:'Feste Leistung bei Leistungsquelle „fest“ oder als Fallback bei „auto“.'},
              {id:'thermalCapacityKwhPerK',label:'Thermische Kapazität',type:'number',default:0,min:0,max:10000,step:0.01,required:true,unit:'kWh/K',description:'Optionaler Start-/Fallbackwert. 0 = nicht vorgeben; die Funktion lernt aus realen Aufheizungen.'},
              {id:'minLearningMinutes',label:'Min. Lernzeit',type:'number',default:10,min:1,max:1440,step:1,required:true,unit:'min',description:'Mindestdauer für eine belastbare gemessene Aufheizrate.'},
              {id:'minTempRiseK',label:'Min. Temperaturanstieg',type:'number',default:0.2,min:0.05,max:20,step:0.05,required:true,unit:'K',description:'Mindestanstieg, bevor ein Lernwert übernommen wird.'},
              {id:'measurementWindowMinutes',label:'Messfenster Aufheizrate',type:'number',default:60,min:1,max:1440,step:1,required:true,unit:'min',description:'Zeitfenster für die lineare Berechnung der realen Temperaturanstiegsgeschwindigkeit.'},
              {id:'maxGapMinutes',label:'Max. Messlücke',type:'number',default:30,min:1,max:1440,step:1,required:true,unit:'min',description:'Größere Datenlücken starten einen neuen Aufheizzyklus.'},
              {id:'smoothingAlpha',label:'Lernfaktor',type:'number',default:0.25,min:0.01,max:1,step:0.01,required:true,description:'Gewichtung neuer Lernwerte für die thermische Kapazität.'},
              {id:'targetToleranceK',label:'Zieltoleranz',type:'number',default:0.1,min:0,max:10,step:0.05,required:true,unit:'K',description:'Toleranz für die Meldung Zieltemperatur erreicht.'},
              {id:'persistMinSeconds',label:'Persistenz Mindestabstand',type:'number',default:10,min:0,max:3600,step:1,required:true,unit:'s',description:'Mindestabstand zwischen Schreibvorgängen der Zustandsdatei. 0 = bei jedem Lauf.'}
            ],
            dataPoints: [
              {output:1,path:'msg.payload.temperatureC',label:'Aktuelle Temperatur',type:'number',unit:'°C',description:'Aktuelle gemessene Temperatur.'},
              {output:1,path:'msg.payload.targetTemperatureC',label:'Zieltemperatur',type:'number',unit:'°C',description:'Verwendete Zieltemperatur.'},
              {output:1,path:'msg.payload.heatingActive',label:'Aufheizung aktiv',type:'boolean',description:'Aktueller Aufheizstatus aus msg.payload.'},
              {output:1,path:'msg.payload.powerKw',label:'Heizleistung',type:'number',unit:'kW',description:'Verwendete aktuelle oder feste Heizleistung.'},
              {output:1,path:'msg.payload.temperatureRiseRateKPerHour',label:'Aufheizrate',type:'number',unit:'K/h',description:'Für die Prognose verwendete Temperaturanstiegsrate.'},
              {output:1,path:'msg.payload.remainingMinutes',label:'Rest-Aufheizdauer',type:'number',unit:'min',description:'Restdauer bis Ziel, wenn Aufheizung aktiv ist.'},
              {output:1,path:'msg.payload.estimatedMinutesIfHeating',label:'Prognose bei Aufheizung',type:'number',unit:'min',description:'Geschätzte Dauer bis Ziel auch bei aktuell ausgeschalteter Aufheizung, sofern ein Modell vorhanden ist.'},
              {output:1,path:'msg.payload.estimatedTargetTimeLocal',label:'Voraussichtliche Zielzeit',type:'string',description:'Lokaler geschätzter Zeitpunkt der Zieltemperatur.'},
              {output:1,path:'msg.payload.targetReached',label:'Ziel erreicht',type:'boolean',description:'true, wenn Zieltemperatur innerhalb der Toleranz erreicht ist.'},
              {output:1,path:'msg.payload.calculationMethod',label:'Berechnungsmethode',type:'string',description:'Gemessene Aufheizrate, gelernte oder hinterlegte thermische Kapazität.'},
              {output:1,path:'msg.payload.model.learnedThermalCapacityKwhPerK',label:'Gelernte thermische Kapazität',type:'number',unit:'kWh/K',description:'Aus realen Aufheizvorgängen gelernter effektiver Wert.'},
              {output:1,path:'msg.payload.status',label:'Status',type:'string',description:'Aktueller Zustand der Berechnung.'},
              {scope:'global',path:'global.Aufheizdauer_Rest_min',label:'Restdauer global',type:'number',unit:'min',description:'Global gespeicherte Rest-Aufheizdauer.'},
              {scope:'global',path:'global.Aufheizdauer_Rate_K_h',label:'Aufheizrate global',type:'number',unit:'K/h',description:'Global gespeicherte verwendete Aufheizrate.'},
              {scope:'global',path:'global.Aufheizdauer_Aktiv',label:'Aufheizung aktiv global',type:'boolean',description:'Global gespeicherter Aufheizstatus.'},
              {scope:'global',path:'global.Aufheizdauer_Zielzeit_Lokal',label:'Zielzeit global',type:'string',description:'Global gespeicherte geschätzte Zielzeit.'}
            ]
          };
          fs.writeFileSync(manifestFile, JSON.stringify(manifest, null, 2) + '\n');

          const readmeFile = 'README.md';
          let text = fs.readFileSync(readmeFile, 'utf8');
          const marker = '## Heizung – Aufheizdauer berechnen';
          if (!text.includes(marker)) {
            text += `\n\n---\n\n## Heizung – Aufheizdauer berechnen\n\n**Version:** 1.0.0  \n**Ausgänge:** 1  \n**Persistenz über Node-RED-Neustart:** ja\n\nBerechnet die voraussichtliche Restzeit bis zu einer Zieltemperatur. Die Funktion verwendet die reale gemessene Aufheizrate und kann zusätzlich die Heizleistung aus dem Payload oder eine fest hinterlegte Leistung verwenden.\n\n### Eingang\n\nBeispiel mit aktueller Leistung:\n\n\`\`\`json\n{\n  "temperature": 19.4,\n  "power": 5.2,\n  "heating": true\n}\n\`\`\`\n\nOptional kann auch die Zieltemperatur im Payload mitgegeben werden:\n\n\`\`\`json\n{\n  "temperature": 19.4,\n  "powerKw": 5.2,\n  "heating": true,\n  "targetTemperatureC": 22\n}\n\`\`\`\n\nWird keine Leistung im Payload geliefert, kann im EBST-Node eine feste Heizleistung hinterlegt werden.\n\n### Wichtige Ergebnisse\n\n\`\`\`text\nmsg.payload.temperatureC\nmsg.payload.targetTemperatureC\nmsg.payload.heatingActive\nmsg.payload.powerKw\nmsg.payload.temperatureRiseRateKPerHour\nmsg.payload.remainingMinutes\nmsg.payload.remainingHours\nmsg.payload.estimatedMinutesIfHeating\nmsg.payload.estimatedTargetTimeLocal\nmsg.payload.targetReached\nmsg.payload.calculationMethod\nmsg.payload.model.learnedThermalCapacityKwhPerK\nmsg.payload.status\n\`\`\`\n\nWährend einer aktiven Aufheizung lernt die Funktion aus Temperaturänderung, Zeit und Leistung die reale Anlage. Nach ausreichender Messzeit wird bevorzugt die tatsächlich gemessene Aufheizrate für die Restzeit verwendet.\n\nDer Lernzustand wird gespeichert unter:\n\n\`\`\`text\n<Node-RED-userDir>/.ebst-remote-functions/state/aufheizdauer-berechnung.json\n\`\`\`\n\nDadurch bleiben Lernwerte nach einem Node-RED-Neustart erhalten.\n`;
            fs.writeFileSync(readmeFile, text);
          }
          NODE

      - name: Änderungen committen
        run: |
          if git diff --quiet -- remote/manifest.json README.md; then
            echo "Manifest und README bereits aktuell."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remote/manifest.json README.md
          git commit -m "Aufheizdauer-Funktion registrieren und dokumentieren"
          git push
