name: EBST Schulferien Oesterreich registrieren

on:
  push:
    paths:
      - ".github/workflows/register-schulferien-oesterreich.yml"

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Manifest README und Check aktualisieren
        run: |
          node <<'NODE'
          const fs = require('fs');

          const manifestFile = 'remote/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestFile, 'utf8'));
          manifest.functions['schulferien-oesterreich'] = {
            name: 'Schulferien Österreich',
            category: 'Kalender',
            version: '1.0.0',
            url: 'https://raw.githubusercontent.com/stephanflug/Bibliothek_Node_Red_Code/main/remote/functions/kalender/schulferien-oesterreich.js',
            description: 'Schulferien-Kalender für Österreich mit Auswahl des Bundeslandes. Liefert allgemeine Ferien, Sommerferien und Detaildaten inklusive nächstem Ferienzeitraum und Resttagen.',
            localFile: 'remote/functions/kalender/schulferien-oesterreich.js',
            outputs: 3,
            outputLabels: ['Ferien aktiv', 'Sommerferien aktiv', 'Details'],
            settings: [
              {
                id:'bundesland',
                label:'Bundesland',
                type:'select',
                default:'AT-TI',
                required:true,
                options:[
                  {value:'AT-BL',label:'Burgenland'},
                  {value:'AT-KÄ',label:'Kärnten'},
                  {value:'AT-NÖ',label:'Niederösterreich'},
                  {value:'AT-OÖ',label:'Oberösterreich'},
                  {value:'AT-SB',label:'Salzburg'},
                  {value:'AT-SM',label:'Steiermark'},
                  {value:'AT-TI',label:'Tirol'},
                  {value:'AT-VA',label:'Vorarlberg'},
                  {value:'AT-WI',label:'Wien'}
                ],
                description:'Bundesland auswählen, dessen Schulferien ausgewertet werden sollen.'
              },
              {
                id:'refreshMinutes',
                label:'API-Aktualisierung',
                type:'number',
                default:720,
                min:15,
                max:10080,
                step:15,
                required:true,
                unit:'min',
                description:'Zeit bis die Ferienliste erneut von OpenHolidays geladen wird. Standard: 12 Stunden.'
              },
              {
                id:'useCacheOnError',
                label:'Bei API-Fehler letzte Daten verwenden',
                type:'boolean',
                default:true,
                required:true,
                description:'Wenn die API nicht erreichbar ist, werden die zuletzt geladenen Daten weiter verwendet.'
              }
            ],
            dataPoints: [
              {output:1,path:'msg.payload',label:'Schulferien aktiv',type:'boolean',description:'true, wenn heute im ausgewählten Bundesland ein Schulferienzeitraum aktiv ist.'},
              {output:2,path:'msg.payload',label:'Sommerferien aktiv',type:'boolean',description:'true, wenn heute Sommerferien im ausgewählten Bundesland sind.'},
              {output:3,path:'msg.payload.bundesland',label:'Bundesland',type:'string'},
              {output:3,path:'msg.payload.ferienAktiv',label:'Ferien aktiv',type:'boolean'},
              {output:3,path:'msg.payload.sommerferienAktiv',label:'Sommerferien aktiv',type:'boolean'},
              {output:3,path:'msg.payload.aktuelleFerienName',label:'Aktuelle Ferien',type:'string'},
              {output:3,path:'msg.payload.aktuelleFerienBeginn',label:'Aktuelle Ferien Beginn',type:'string'},
              {output:3,path:'msg.payload.aktuelleFerienEnde',label:'Aktuelle Ferien Ende',type:'string'},
              {output:3,path:'msg.payload.tageFerienRest',label:'Resttage aktuelle Ferien',type:'number',unit:'Tage'},
              {output:3,path:'msg.payload.naechsteFerienName',label:'Nächste Ferien',type:'string'},
              {output:3,path:'msg.payload.naechsteFerienBeginn',label:'Nächste Ferien Beginn',type:'string'},
              {output:3,path:'msg.payload.naechsteFerienEnde',label:'Nächste Ferien Ende',type:'string'},
              {output:3,path:'msg.payload.tageBisNaechsteFerien',label:'Tage bis nächste Ferien',type:'number',unit:'Tage'},
              {output:3,path:'msg.payload.sommerferienBeginn',label:'Sommerferien Beginn',type:'string'},
              {output:3,path:'msg.payload.sommerferienEnde',label:'Sommerferien Ende',type:'string'},
              {output:3,path:'msg.payload.tageBisSommerferien',label:'Tage bis Sommerferien',type:'number',unit:'Tage'},
              {output:3,path:'msg.payload.tageSommerferienRest',label:'Resttage Sommerferien',type:'number',unit:'Tage'},
              {output:3,path:'msg.payload.ferienListe',label:'Ferienliste',type:'array'},
              {output:3,path:'msg.payload.stale',label:'Cache-Daten wegen API-Fehler',type:'boolean'},
              {scope:'flow',path:'flow.Schulferien_Aktiv',label:'Schulferien aktiv Flow',type:'boolean'},
              {scope:'flow',path:'flow.Schulferien_Name',label:'Aktuelle Schulferien Flow',type:'string'},
              {scope:'flow',path:'flow.Schulferien_Naechste_Name',label:'Nächste Schulferien Flow',type:'string'},
              {scope:'flow',path:'flow.Schulferien_Tage_bis_naechste',label:'Tage bis nächste Ferien Flow',type:'number',unit:'Tage'},
              {scope:'flow',path:'flow.Schulferien_Sommer_Aktiv',label:'Sommerferien aktiv Flow',type:'boolean'},
              {scope:'flow',path:'flow.Schulferien_Tage_bis_Sommer',label:'Tage bis Sommerferien Flow',type:'number',unit:'Tage'},
              {scope:'global',path:'global.Schulferien_Aktiv',label:'Schulferien aktiv global',type:'boolean'},
              {scope:'global',path:'global.Schulferien_Sommer_Aktiv',label:'Sommerferien aktiv global',type:'boolean'},
              {scope:'global',path:'global.Schulferien_Info',label:'Schulferien Details global',type:'object'}
            ]
          };
          fs.writeFileSync(manifestFile, JSON.stringify(manifest, null, 2) + '\n');

          const readmeFile = 'README.md';
          let text = fs.readFileSync(readmeFile, 'utf8');
          const marker = '## Kalender – Schulferien Österreich';
          if (!text.includes(marker)) {
            text += `\n\n---\n\n## Kalender – Schulferien Österreich\n\n**Version:** 1.0.0  \n**Ausgänge:** 3 – Ferien aktiv / Sommerferien aktiv / Details\n\nSchulferien-Kalender für Österreich mit direkter Auswahl des Bundeslandes im EBST-Node. Die Daten werden über die OpenHolidays API geladen.\n\n### Bundesländer\n\n\`\`\`text\nBurgenland\nKärnten\nNiederösterreich\nOberösterreich\nSalzburg\nSteiermark\nTirol\nVorarlberg\nWien\n\`\`\`\n\n### Ausgänge\n\n\`\`\`text\nAusgang 1 → Schulferien aktuell true/false\nAusgang 2 → Sommerferien aktuell true/false\nAusgang 3 → Detailobjekt\n\`\`\`\n\n### Wichtige Detailwerte\n\n\`\`\`text\nmsg.payload.bundesland\nmsg.payload.ferienAktiv\nmsg.payload.sommerferienAktiv\nmsg.payload.aktuelleFerienName\nmsg.payload.aktuelleFerienBeginn\nmsg.payload.aktuelleFerienEnde\nmsg.payload.tageFerienRest\nmsg.payload.naechsteFerienName\nmsg.payload.naechsteFerienBeginn\nmsg.payload.naechsteFerienEnde\nmsg.payload.tageBisNaechsteFerien\nmsg.payload.sommerferienBeginn\nmsg.payload.sommerferienEnde\nmsg.payload.tageBisSommerferien\nmsg.payload.tageSommerferienRest\nmsg.payload.ferienListe\n\`\`\`\n\nDie wichtigsten Werte werden zusätzlich als \`flow.Schulferien_*\` und \`global.Schulferien_*\` gespeichert. Bei einem API-Fehler kann optional die letzte gültige Ferienliste weiterverwendet werden.\n`;
            fs.writeFileSync(readmeFile, text);
          }

          const pkgFile = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgFile, 'utf8'));
          const checkPart = 'node --check remote/functions/kalender/schulferien-oesterreich.js';
          if (pkg.scripts && pkg.scripts.check && !pkg.scripts.check.includes('schulferien-oesterreich.js')) {
            pkg.scripts.check += ' && ' + checkPart;
            fs.writeFileSync(pkgFile, JSON.stringify(pkg, null, 2) + '\n');
          }
          NODE

      - name: Syntax der neuen Funktion prüfen
        run: node --check remote/functions/kalender/schulferien-oesterreich.js

      - name: Änderungen committen
        run: |
          if git diff --quiet -- remote/manifest.json README.md package.json; then
            echo "Bereits aktuell."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remote/manifest.json README.md package.json
          git commit -m "Schulferien Österreich registrieren und dokumentieren"
          git push
