name: Strompreise aktualisieren

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Playwright installieren
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Offizielle Strompreise prüfen
        run: node scripts/update-strompreise.mjs
      - name: Änderungen speichern
        run: |
          if git diff --quiet -- remote/data/strompreise.json; then
            echo "Keine Preisänderung."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remote/data/strompreise.json
          git commit -m "Automatische Aktualisierung Strompreise"
          git push
