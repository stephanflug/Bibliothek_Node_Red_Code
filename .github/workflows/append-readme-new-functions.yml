name: README neue Funktionen ergänzen

on:
  push:
    paths:
      - ".github/workflows/append-readme-new-functions.yml"

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fehlende Funktionsabschnitte anhängen
        run: |
          if ! grep -Fq "## Kalender – Feiertag Tirol + Wochenende" README.md; then
            printf '%s' '' | base64 -d | gzip -d >> README.md
          fi
      - name: Änderung committen
        run: |
          if git diff --quiet -- README.md; then
            echo "README bereits aktuell."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "README um Kalender- und Heizungsfunktionen ergänzen"
          git push
