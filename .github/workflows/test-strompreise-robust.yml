name: Strompreise Robust Test v4

on:
  push:
    paths:
      - ".github/workflows/test-strompreise-robust.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax prüfen
        run: node --check scripts/update-strompreise.mjs
      - name: Playwright installieren
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Reader-Diagnose Energie und Netz
        run: |
          echo "===== TIWAG PRIVAT ====="
          curl -Ls --max-time 45 "https://r.jina.ai/https://www.tiwag.at/privat/" | grep -Ei -C 4 "comfort privat|Arbeitspreis|11,76|9,80" | head -n 120 || true
          echo "===== TINETZ ====="
          curl -Ls --max-time 45 "https://r.jina.ai/https://www.tinetz.at/infobereich/allgemeines/netztarifaenderungen-ab-2026/" | grep -Ei -C 5 "8,66|9,40|Cent/kWh|Tirol" | head -n 140 || true
      - name: Strompreislesung testen
        run: node scripts/update-strompreise.mjs
      - name: Ergebnis anzeigen
        run: |
          cat remote/data/strompreise.json
          git diff -- remote/data/strompreise.json || true
