name: Strompreise Robust Test v5

on:
  push:
    paths:
      - ".github/workflows/test-strompreise-robust.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax prüfen
        run: node --check scripts/update-strompreise.mjs
      - name: Playwright installieren
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Reader-Diagnose Energie und Netz
        run: |
          echo "===== TIWAG COMFORT SEITE ====="
          curl -Ls --max-time 45 "https://r.jina.ai/http://www.tiwag.at/privat/strom/stromprodukt/comfort-privat/" | grep -Ei -C 5 "comfort privat|Arbeitspreis|11,76|9,80" | head -n 140 || true
          echo "===== TIWAG COMFORT PDF ====="
          curl -Ls --max-time 45 "https://r.jina.ai/https://www.tiwag.at/uploads/tx_bh/tiwag_comfort_privat_produkt_und_preisblatt.pdf" | grep -Ei -C 6 "Arbeitspreis|11,76|9,80|Cent/kWh" | head -n 160 || true
          echo "===== TINETZ HTTP-READER ====="
          curl -Ls --max-time 45 "https://r.jina.ai/http://www.tinetz.at/infobereich/allgemeines/netztarifaenderungen-ab-2026/" | grep -Ei -C 6 "8,66|9,40|Cent/kWh|Tirol" | head -n 160 || true
          echo "===== TINETZ PDF ====="
          curl -Ls --max-time 45 "https://r.jina.ai/https://www.tinetz.at/uploads/tx_bh/765/tinetz_sne-v_2026.pdf?mod=1766133961" | grep -Ei -C 6 "Bereich Tirol|Netzebene 7|6,81|5,45" | head -n 180 || true
      - name: Strompreislesung testen
        run: node scripts/update-strompreise.mjs
      - name: Ergebnis anzeigen
        run: |
          cat remote/data/strompreise.json
          git diff -- remote/data/strompreise.json || true
